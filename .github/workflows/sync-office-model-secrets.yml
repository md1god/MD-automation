name: Sync office model keys to Supabase
on:
  workflow_dispatch:
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Push keys to Supabase Edge secrets
        env:
          SUPABASE_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          GROQ_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENCODE_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          token = os.environ.get('SUPABASE_TOKEN', '')
          pairs = [('GROQ_KEY', 'GROQ_API_KEY'), ('OPENROUTER_KEY', 'OPENROUTER_API_KEY'), ('OPENCODE_KEY', 'OPENCODE_API_KEY')]
          secrets = [{'name': dst, 'value': os.environ[src]} for src, dst in pairs if os.environ.get(src)]
          if not secrets:
              raise SystemExit('No model keys available')
          req = urllib.request.Request(
              'https://api.supabase.com/v1/projects/fksjltytevcmpjxzamhp/secrets',
              data=json.dumps(secrets).encode(),
              method='POST',
              headers={'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json'})
          with urllib.request.urlopen(req, timeout=30) as r:
              print('Supabase secrets status:', r.status, 'count:', len(secrets))
          PY
