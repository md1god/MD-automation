name: Security Audit (Rust + Solidity)

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
  push:
    paths:
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - '**/*.sol'

jobs:
  rust-audit:
    name: Rust Dependency Audit (when Rust exists)
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Detect Rust lockfile
        id: detect
        run: |
          if find . -name Cargo.lock -type f -print -quit | grep -q .; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No Cargo.lock found; Rust audit skipped for this repository."
          fi
      - name: Run cargo audit
        if: steps.detect.outputs.present == 'true'
        uses: actions-rust-lang/audit@72c09e02f132669d52284a3323acdb503cfc1a24 # v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  solidity-audit:
    name: Solidity Static Analysis (when Solidity exists)
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Detect Solidity sources
        id: detect
        run: |
          if find . -name '*.sol' -type f -print -quit | grep -q .; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No Solidity source found; Slither audit skipped for this repository."
          fi
      - name: Run Slither
        id: slither
        if: steps.detect.outputs.present == 'true'
        uses: crytic/slither-action@4fd765aeef19915d04ddf0be90c2930036a774d8 # v0.4.1
        continue-on-error: true      # so the SARIF report below is still uploaded
        with:
          sarif: results.sarif
          fail-on: high
      - name: Upload SARIF results
        if: always() && steps.detect.outputs.present == 'true' && hashFiles('results.sarif') != ''
        uses: github/codeql-action/upload-sarif@9418214df1f2c4b8128c770156c409013b07d6b9 # v3
        with:
          sarif_file: results.sarif
      # continue-on-error hides failures, so high-severity findings could never turn the job red.
      - name: Fail the audit if Slither found high-severity issues
        if: always() && steps.slither.outcome == 'failure'
        run: |
          echo "::error::Slither reported high-severity findings (see the uploaded SARIF results)"
          exit 1
