name: MD1 Growth Engine

on:
  schedule:
    - cron: "30 9 * * *"      # every day 09:30 UTC (12:30 Cairo)
  workflow_dispatch:
    inputs:
      dry:
        description: "dry run - writes the posts, publishes NOTHING (untick to publish for real)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: growth
  cancel-in-progress: false

jobs:
  growth:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: md1_global_agent/requirements.txt

      - run: pip install -r md1_global_agent/requirements.txt

      - name: Install OpenCode CLI (free models)
        continue-on-error: true
        run: npm install -g opencode-ai

      - name: Select, write, publish, measure
        working-directory: md1_global_agent
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          API_KEYS: ${{ secrets.API_KEYS }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python -m growth.engine ${{ inputs.dry && '--dry' || '' }}

      - name: Save state straight to main (no pull request)
        if: always()
        run: |
          git config user.name "MD1 Bot"
          git config user.email "action@github.com"
          git add md1_global_agent/growth/state.json
          if git diff --cached --quiet; then echo "no state change"; exit 0; fi
          git commit -m "growth: update publish state [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
