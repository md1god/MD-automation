name: Generate Pages Automatically

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

concurrency:
  group: generate-pages
  cancel-in-progress: false

jobs:
  generate-pages:
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: page-generator
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '20'

      - name: Generate New Page
        run: node build-pages.js

      - name: Check for changes
        id: check_changes
        run: |
          if git diff --quiet -- content-library pages build-state.json pages-index.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and Push
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "MD1 Bot"
          git add -A
          git commit -m "New page - $(date +%Y-%m-%d_%H-%M-%S)"
          # Research, scout and telegram workflows also push to main: rebase and retry on a race.
          for attempt in 1 2 3 4 5; do
            if git pull --rebase && git push; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $(( attempt * 5 ))
          done
          echo "::error::could not push the generated page after 5 attempts"
          exit 1
