name: Reusable Content Check

on:
  workflow_call:
    inputs:
      required-files:
        description: "قائمة الملفات المطلوبة، كل ملف في سطر (مسارات نسبية لجذر الريبو، مثال dist/index.html)"
        required: true
        type: string
      min-bytes:
        description: "أقل حجم مقبول بالبايت لكل ملف مطلوب"
        required: false
        type: string
        default: '1'
      build-command:
        description: "أمر البناء (لو المشروع فيه build step زي Vite). سيبه فاضي لو مفيش build"
        required: false
        type: string
        default: 'npm run build'
      skip-build:
        description: "true لو الريبو مش محتاج npm install/build خالص (مثلاً موقع HTML ثابت)"
        required: false
        type: boolean
        default: false
      node-version:
        required: false
        type: string
        default: '20'

jobs:
  check:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        if: ${{ inputs.skip-build == false }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ inputs.node-version }}

      - name: Detect package manager and install deps
        if: ${{ inputs.skip-build == false }}
        run: |
          if [ -f "pnpm-lock.yaml" ]; then
            echo "PKG_MANAGER=pnpm" >> "$GITHUB_ENV"
            corepack enable
            corepack prepare pnpm@10.34.9 --activate
            pnpm install --frozen-lockfile || pnpm install
          elif [ -f "yarn.lock" ]; then
            echo "PKG_MANAGER=yarn" >> "$GITHUB_ENV"
            corepack enable
            yarn install --frozen-lockfile || yarn install
          elif [ -f "package-lock.json" ]; then
            echo "PKG_MANAGER=npm" >> "$GITHUB_ENV"
            npm ci
          elif [ -f "package.json" ]; then
            echo "PKG_MANAGER=npm" >> "$GITHUB_ENV"
            npm install
          else
            echo "لا يوجد package.json — تخطي تثبيت الاعتمادات"
            echo "PKG_MANAGER=none" >> "$GITHUB_ENV"
          fi

      - name: Build project
        if: ${{ inputs.skip-build == false }}
        env:
          BUILD_CMD: ${{ inputs.build-command }}
        run: |
          if [ "$PKG_MANAGER" = "none" ]; then
            echo "مفيش package.json، تخطي خطوة البناء"
          elif [ "$PKG_MANAGER" = "pnpm" ]; then
            pnpm run build
          elif [ "$PKG_MANAGER" = "yarn" ]; then
            yarn build
          else
            bash -c "$BUILD_CMD"
          fi

      - name: Check required files
        id: content_check
        env:
          MIN_BYTES: ${{ inputs.min-bytes }}
          REQUIRED_FILES: ${{ inputs.required-files }}
        run: |
          set +e
          FAILED=0
          REPORT=""

          while IFS= read -r file; do
            [ -z "$file" ] && continue
            if [ ! -f "$file" ]; then
              REPORT="${REPORT}❌ الملف غير موجود: \`$file\`\n"
              FAILED=1
              continue
            fi
            SIZE=$(stat -c%s "$file")
            if [ "$SIZE" -lt "$MIN_BYTES" ]; then
              REPORT="${REPORT}⚠️ الملف \`$file\` صغير جدًا ($SIZE بايت، الحد الأدنى $MIN_BYTES)\n"
              FAILED=1
            else
              REPORT="${REPORT}✅ \`$file\` ($SIZE بايت)\n"
            fi
          done <<< "$REQUIRED_FILES"

          echo -e "$REPORT"
          DELIM="EOF_$(od -An -N8 -tx1 /dev/urandom | tr -d ' \n')"
          {
            echo "report<<$DELIM"
            echo -e "$REPORT"
            echo "$DELIM"
          } >> "$GITHUB_OUTPUT"

          if [ "$FAILED" -eq 1 ]; then
            echo "failed=true" >> "$GITHUB_OUTPUT"
          else
            echo "failed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Open issue on failure
        if: steps.content_check.outputs.failed == 'true'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          REPORT: ${{ steps.content_check.outputs.report }}
        with:
          script: |
            const report = process.env.REPORT;
            const title = `🚨 فشل فحص المحتوى - ${new Date().toISOString().slice(0,10)}`;
            const body = [
              'فحص المحتوى الدوري لقى مشكلة في الملفات المطلوبة:',
              '',
              report,
              '',
              `تفاصيل التشغيل: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            ].join('\n');

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'content-check'
            });

            const existing = issues.find(i => i.title.startsWith('🚨 فشل فحص المحتوى'));
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['content-check']
              });
            }

      - name: Fail job if content check failed
        if: steps.content_check.outputs.failed == 'true'
        run: exit 1
