name: Master Pipeline
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

# المستودعات المستهدفة عامة؛ لا نستخدم SITES_PAT منتهي الصلاحية للفحص.
# نشر المواقع نفسه يتم من داخل كل مستودع عبر Workflow الخاص به.
jobs:
  orchestrate:
    strategy:
      fail-fast: false
      matrix:
        site: [MD1usd.com, MDM1.org]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout public site
        uses: actions/checkout@v4
        with:
          repository: md1god/${{ matrix.site }}
          path: site

      - name: Detect and build if needed
        id: build
        working-directory: site
        run: |
          set -e
          if [ -f package.json ]; then
            npm ci
            npm run build
          else
            echo "Static site: no package.json, source check passed."
          fi

      - name: Report successful validation
        run: |
          echo "✅ ${{ matrix.site }} passed the shared validation."
          echo "Deployment remains owned by the site's own GitHub Pages workflow."
