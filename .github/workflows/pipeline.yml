name: Master Pipeline
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

# المستودعات عامة؛ لا نستخدم SITES_PAT منتهي الصلاحية للفحص.
permissions:
  contents: read
  actions: write

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        site: [MD1usd.com, MDM1.org]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout public site
        uses: actions/checkout@v4
        with:
          repository: md1god/${{ matrix.site }}
          path: site

      - name: Detect and build if needed
        working-directory: site
        run: |
          set -e
          if [ -f package.json ]; then
            npm ci
            npm run build
          else
            echo "Static site: no package.json, source check passed."
          fi

      - name: Report successful validation
        run: echo "✅ ${{ matrix.site }} passed the shared validation."

  publish:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Telegram publish after both site checks
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'publish.yml',
              ref: 'main'
            });
            core.info('✅ تم تشغيل Workflow النشر التسويقي بعد نجاح فحص الموقعين.');
