name: Reusable Deploy
on:
  workflow_call:
    inputs:
      node-version: { type: string, default: '20' }
      build-command: { type: string, default: 'npm run build' }
      output-dir: { type: string, default: 'dist' }
      site-dir: { type: string, default: '.' }
jobs:
  deploy:
    runs-on: ubuntu-26.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - id: detect
        run: |
          if [ -f package.json ]; then echo "has_package=true" >> "$GITHUB_OUTPUT"
          else echo "has_package=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        if: steps.detect.outputs.has_package == 'true'
        with: { node-version: '${{ inputs.node-version }}', cache: 'npm' }
      - run: npm ci
        if: steps.detect.outputs.has_package == 'true'
      - name: Build
        if: steps.detect.outputs.has_package == 'true'
        env:
          BUILD_COMMAND: ${{ inputs.build-command }}
        run: |
          case "$BUILD_COMMAND" in
            "npm run build") npm run build ;;
            *) echo "Unsupported build command" >&2; exit 1 ;;
          esac
      - id: path
        run: |
          if [ "${{ steps.detect.outputs.has_package }}" = "true" ]; then echo "dir=${{ inputs.output-dir }}" >> "$GITHUB_OUTPUT"
          else echo "dir=${{ inputs.site-dir }}" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with: { path: '${{ steps.path.outputs.dir }}' }
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
