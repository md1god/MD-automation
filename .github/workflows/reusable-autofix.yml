name: Reusable Auto Fix
# Regenerates the lockfile and, if the build then passes, opens a PULL REQUEST for review.
# It never pushes to the base branch: new in-range dependency versions must be reviewed before they reach it.
# Requirements for the caller: permissions contents: write, pull-requests: write, issues: write, and the repo
# setting "Allow GitHub Actions to create and approve pull requests" turned ON.
# Note: a PR opened with GITHUB_TOKEN does not start other workflows; close and reopen it to run its checks.
on:
  workflow_call:
    inputs:
      node-version: { type: string, default: '20' }
      build-command: { type: string, default: 'npm run build' }
      base-branch: { type: string, default: 'main' }
jobs:
  fix:
    runs-on: ubuntu-26.04
    permissions: { contents: write, pull-requests: write, issues: write }
    steps:
      # No credentials left on disk while `npm install` runs third-party install scripts.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: '${{ inputs.base-branch }}'
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with: { node-version: '${{ inputs.node-version }}' }
      - run: |
          rm -rf node_modules package-lock.json
          npm install
      - id: retry
        continue-on-error: true
        env:
          BUILD_CMD: ${{ inputs.build-command }}
        run: bash -c "$BUILD_CMD"
      - id: pr
        if: steps.retry.outcome == 'success'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          base: ${{ inputs.base-branch }}
          branch: auto-fix/lockfile
          add-paths: package-lock.json
          commit-message: 'fix: regenerate lockfile [auto-fix]'
          title: 'fix: regenerate lockfile [auto-fix]'
          body: |
            Lockfile regenerated automatically after a failed build; the build passes with it.
            Review the dependency changes before merging.

            Closes #${{ github.event.issue.number }}
          delete-branch: true
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          OUTCOME: ${{ steps.retry.outcome }}
          PR_URL: ${{ steps.pr.outputs.pull-request-url }}
        with:
          script: |
            const success = process.env.OUTCOME === 'success';
            const prUrl = process.env.PR_URL;
            let body;
            if (!success) body = '❌ الإصلاح التلقائي مش كفى، محتاج مراجعة يدوية.';
            else if (prUrl) body = `✅ البناء نجح بعد إعادة توليد الـ lockfile. فتحت PR للمراجعة: ${prUrl}`;
            else body = '✅ البناء نجح ومفيش تغيير في الـ lockfile، فمفيش PR مطلوب.';
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
