name: MD1 Global Scout

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write
  models: read

jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: md1_global_agent
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: md1_global_agent/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install OpenCode CLI (free models only work from inside OpenCode)
        continue-on-error: true
        run: npm install -g opencode-ai

      - name: Run scout (Dry Run - nothing is published)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          API_KEYS: ${{ secrets.API_KEYS }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PRODUCTHUNT_TOKEN: ${{ secrets.PRODUCTHUNT_TOKEN }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py | tee report.txt

      - name: Open an issue with today's plan (if a plan was written)
        if: hashFiles('md1_global_agent/plan.md') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "Scout plan $(date -u +%F)" \
            --body-file plan.md

      - name: Remember what was planned (straight to main, no PR)
        if: always()
        working-directory: .
        run: |
          git config user.name "MD1 Bot"
          git config user.email "action@github.com"
          git add md1_global_agent/memory/planned.json md1_global_agent/memory/memory.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "nothing new to remember"; exit 0; fi
          git commit -m "scout: remember planned repos [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Show report in job summary
        if: always()
        run: |
          {
            echo "## MD1 Global Scout report"
            echo '```'
            cat report.txt 2>/dev/null || echo "no report"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scout-report
          path: md1_global_agent/report.txt
          if-no-files-found: ignore
