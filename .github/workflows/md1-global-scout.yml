name: MD1 Global Scout

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write      # commits the anti-repeat ledger + pending pages
  models: read

concurrency:
  group: scout
  cancel-in-progress: false

jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    defaults:
      run:
        working-directory: md1_global_agent
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: md1_global_agent/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Browser for the independent QA reviewer (screenshots)
        run: python -m playwright install --with-deps chromium

      - name: Checkout the site (templates/CSS used to render apps for QA)
        uses: actions/checkout@v4
        with:
          repository: md1god/mdm1.org
          token: ${{ secrets.SITES_PAT }}
          path: site
          fetch-depth: 1

      - name: Install OpenCode CLI (free models only work from inside OpenCode)
        run: npm install -g opencode-ai

      - name: Validate production credentials
        env:
          API_KEYS: ${{ secrets.API_KEYS }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${API_KEYS}${OPENCODE_API_KEY}${OPENROUTER_API_KEY}${GROQ_API_KEY}" ]; then
            echo 'No LLM provider secret is configured.' >&2
            exit 1
          fi
          if [ -z "${TELEGRAM_BOT_TOKEN}${BOT_TOKEN}" ]; then
            echo 'No Telegram bot secret is configured.' >&2
            exit 1
          fi

      - name: Run scout (production report; no public source identity)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          API_KEYS: ${{ secrets.API_KEYS }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PRODUCTHUNT_TOKEN: ${{ secrets.PRODUCTHUNT_TOKEN }}
          SITES_PAT: ${{ secrets.SITES_PAT }}
          SITE_DIR: ${{ github.workspace }}/site
          LEDGER_SALT: ${{ secrets.LEDGER_SALT }}
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
          MASTODON_BASE_URL: ${{ secrets.MASTODON_BASE_URL }}
          MASTODON_ACCESS_TOKEN: ${{ secrets.MASTODON_ACCESS_TOKEN }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py | tee report.txt

      - name: Save anti-repeat ledger (hashes only) and pending pages
        if: always()
        working-directory: .
        run: |
          git config user.name "MD1 Bot"
          git config user.email "action@github.com"
          git add -A md1_global_agent/memory
          if git diff --cached --quiet; then echo "ledger unchanged"; exit 0; fi
          git commit -m "scout: update ledger [skip ci]"
          for attempt in 1 2 3; do
            if git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; then exit 0; fi
            # Two runs saved at once: keep every ledger entry from both sides, then try again.
            git rebase --abort 2>/dev/null || true
            git fetch origin "${GITHUB_REF_NAME}"
            rm -rf /tmp/keep && mkdir -p /tmp/keep && cp -r md1_global_agent/memory/. /tmp/keep/
            git reset -q --hard FETCH_HEAD
            cp -r /tmp/keep/pending md1_global_agent/memory/ 2>/dev/null || true
            cp /tmp/keep/ledger.json md1_global_agent/memory/ledger.json
            git show FETCH_HEAD:md1_global_agent/memory/ledger.json > /tmp/theirs.json 2>/dev/null || echo '{}' > /tmp/theirs.json
            python3 - <<'PY'
          import json, subprocess
          sys_path = "md1_global_agent/memory"
          import importlib.util
          spec = importlib.util.spec_from_file_location("ml", sys_path + "/merge_ledger.py")
          ml = importlib.util.module_from_spec(spec); spec.loader.exec_module(ml)
          ours = json.load(open(ml.PATH, encoding="utf-8")); theirs = json.load(open("/tmp/theirs.json", encoding="utf-8"))
          json.dump(ml.merge(ours, theirs), open(ml.PATH, "w", encoding="utf-8"), indent=1, ensure_ascii=False, sort_keys=True)
          PY
            git add -A md1_global_agent/memory
            git commit -q -m "scout: update ledger (merged) [skip ci]" || true
          done
          echo "::error::could not save the ledger after 3 attempts"; exit 1

      - name: Upload private run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scout-${{ github.run_id }}
          path: |
            md1_global_agent/plan.md
            md1_global_agent/report.txt
          if-no-files-found: ignore

      - name: Show report in job summary
        if: always()
        run: |
          {
            echo "## MD1 Global Scout report"
            echo '```'
            cat report.txt 2>/dev/null || echo "no report"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scout-report
          path: md1_global_agent/report.txt
          if-no-files-found: ignore
