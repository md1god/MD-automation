name: Reusable Publish
on:
  workflow_call:
    inputs:
      queue-dir: { type: string, default: 'content-queue/' }
    secrets:
      BOT_TOKEN: { required: true }
      CHAT_ID: { required: true }
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    # Two overlapping runs would otherwise pick and send the same queued post twice.
    concurrency:
      group: publish-queue-${{ github.repository }}
      cancel-in-progress: false
    env:
      QUEUE_DIR: ${{ inputs.queue-dir }}
    steps:
      - uses: actions/checkout@v6
      - id: pick
        run: |
          file=$(ls "$QUEUE_DIR"/*.txt 2>/dev/null | sort | head -n 1 || true)
          if [ -z "$file" ]; then echo "found=false" >> "$GITHUB_OUTPUT"
          else echo "found=true" >> "$GITHUB_OUTPUT"; echo "file=$file" >> "$GITHUB_OUTPUT"; fi

      # The post is only treated as published if Telegram really accepted it. Before, a bad token or
      # chat id still moved the file to published/ and the post was lost without any error.
      - name: Send to Telegram
        if: steps.pick.outputs.found == 'true'
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          POST_FILE: ${{ steps.pick.outputs.file }}
        run: |
          set -euo pipefail
          response=$(curl -sS -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT_ID}" --data-urlencode "text@${POST_FILE}") || {
            echo "::error::request to Telegram failed"; exit 1; }
          if ! echo "$response" | jq -e '.ok == true' >/dev/null; then
            echo "::error::Telegram rejected the post: $(echo "$response" | jq -r '.description // "unknown error"')"
            exit 1
          fi

      - name: Mark as published and push
        if: steps.pick.outputs.found == 'true'
        env:
          POST_FILE: ${{ steps.pick.outputs.file }}
        run: |
          mkdir -p "$QUEUE_DIR/published"
          mv "$POST_FILE" "$QUEUE_DIR/published/"
          git config user.name "auto-publish-bot"
          git config user.email "actions@github.com"
          git add -A -- "$QUEUE_DIR"
          git commit -m "chore: published post [auto-publish]"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $(( attempt * 5 ))
          done
          echo "::error::post was sent but the queue update could not be pushed"
          exit 1
