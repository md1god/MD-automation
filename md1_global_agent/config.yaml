# MD1 Global Agent configuration
dry_run: false           # discovery + Telegram report are live; source-code rebuilding remains plan-only
max_results_per_query: 10
min_score_to_build: 60   # opportunities below this score are not built
idea_only: true         # take the IDEA only (open or closed, any license); everything is rebuilt original
max_pages: 4            # GitHub search pages scanned per category to find NEW (never examined) projects
# Page languages (Arabic is always included). The site opens each page in the visitor's device
# language and shows a language selector button.
page_languages: [en, es, pt, id, tr, fr, de, hi, ru]
translate_budget_seconds: 900
max_fix_cycles: 3        # hard cap on Builder auto-fix loops (no infinite loops)

# Licenses that allow commercial use / modification
allowed_licenses:
  - mit
  - apache-2.0
  - bsd-2-clause
  - bsd-3-clause
  - isc
  - unlicense
  - mpl-2.0

categories:
  saas:
    query: "saas starter in:name,description stars:>200"
  ai_agents:
    query: "ai agents in:name,description stars:>300"
  developer_tools:
    query: "developer tools cli in:name,description stars:>300"
  ecommerce:
    query: "ecommerce in:name,description stars:>200"
  productivity:
    query: "productivity app in:name,description stars:>300"
  apis:
    query: "api boilerplate in:name,description stars:>200"

# Trending closed products (idea sources only - never copied)
product_sources:
  - hackernews
  - producthunt

destinations:
  - md1usd.com
  - mdm1.org

# Free-first planning providers, tried in order. Models are discovered at run time where possible
# (OpenRouter free list, Groq key's model list, OpenCode CLI model list); names below are preferences.
# opencode_cli = the real OpenCode CLI (free models are refused over the API).
llm:
  providers: [opencode_cli, openrouter, groq, github]
  models:
    opencode_cli: [big-pickle, mimo-v2.6-flash-free, nemotron-3-ultra-free]
    github: [openai/gpt-4o]

# Where the daily report goes if no private chat works (set "" to disable). Uses TELEGRAM_BOT_TOKEN.
telegram_report_channel: "@md1god"

memory_file: memory/memory.json
