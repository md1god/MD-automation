# MD1 Growth Engine - settings. Edit freely; the engine reads this file on every run.
dry_run: false            # true = write the posts and print them, publish nothing
cooldown_days: 3          # the same project is not promoted again within this many days
explore: 0.6              # higher = try untested angles more often, lower = repeat winners

channels:
  telegram:               # needs secret TELEGRAM_BOT_TOKEN; the bot must be admin of the channel
    enabled: true
    chat: "@md1god"
    language: ar
    max_per_day: 1
  devto:                  # needs secret DEVTO_API_KEY (dev.to > Settings > Extensions)
    enabled: true
    language: en
    min_days_between: 7
    tags: [web3, blockchain, opensource, webdev]   # dev.to allows at most 4

# Every post is built ONLY from the facts listed here. Fix or extend them with real, verifiable facts.
projects:
  - id: mdm1
    name: MDM1
    url: https://mdm1.org
    weight: 1.0
    audience: Arabic-speaking people curious about community-driven crypto projects
    facts:
      - "MDM1 is a community token on the Polygon network"
      - "The project site is mdm1.org"
    angles:
      - {id: intro, brief: "Introduce the project in plain words for someone hearing about it for the first time"}
      - {id: build-log, brief: "Share what is being built and improved on the project site"}
      - {id: how-it-works, brief: "Explain how the community side of the project works"}

  - id: md1usd
    name: MD1usd
    url: https://md1usd.com
    weight: 1.0
    audience: Developers and crypto users interested in multi-chain stablecoins
    facts:
      - "MD1usd is a USD-pegged stablecoin project that runs on more than one chain"
      - "The project site is md1usd.com"
    angles:
      - {id: intro, brief: "Introduce the project in plain words"}
      - {id: transparency, brief: "Explain why contracts and verification should be public and checkable by anyone"}
      - {id: multichain, brief: "Explain what multi-chain means for a stablecoin and why it matters to users"}
